simulation: sesion-usuario
routing: path
mocks:
  - name: Usuarios
    routeKey: usuarios
    origin:
      - my-users-api.onrender.com
    path: postman/mocks/usuarios
  - name: Servidor no disponible
    routeKey: caida
    path: postman/mocks/usuarios
    scenarios:
      - overrides:
          conditions:
            error: {status_code: 503}
  - name: Respuesta lenta
    routeKey: lenta
    path: postman/mocks/usuarios
    scenarios:
      - overrides:
          conditions:
            latency: {delay_ms: 500}
